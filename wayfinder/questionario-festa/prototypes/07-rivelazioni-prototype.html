<title>Prototipo Rivelazioni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTIPO USA E GETTA – ticket 07 "Rivelazioni e animazioni video delle risposte".
  Iterazione 2: scelta di Luca = variante A (asse con un pallino per voto) + scomposizione della variante C,
  con i colori aziendali Immedia (cyan #00AEEF, navy #1E2939, ocean #0369A1, gold #C48820; Nunito + Inter).
  Valori e voti sono SEGNAPOSTO in attesa del ticket 04 (dati reali dall'AD).
  Regia: Spazio / PagGiù = avanti, Backspace / PagSu = indietro, 1 / 2 = domanda.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: palco 16:9 proiettato su fondo chiaro come i materiali Immedia; regia in basso fuori dal palco. Unico look chiaro voluto. */
:root {
  --page: #E8EEF5;
  --stage: #FFFFFF;
  --stage-2: #EFF6FF;       /* bg ice */
  --navy: #1E2939;          /* testo */
  --muted: #6A7282;
  --line: #E5E7EB;
  --sala: #00AEEF;          /* cyan aziendale: la sala */
  --ocean: #0369A1;
  --sky: #DBEAFE;
  --real: #C48820;          /* gold aziendale: la realtà */
  --display: "Nunito", Arial, sans-serif;
  --body: "Inter", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--navy); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 120px;
  box-sizing: border-box;
}
#root { display: grid; gap: 12px; justify-items: center; }
.note { font-size: 13px; color: var(--muted); max-width: 70ch; text-align: center; margin: 0; }
.note b { color: var(--real); }

.stage {
  container-type: inline-size;
  width: min(100%, calc((100vh - 180px) * 16 / 9), 1600px);
  aspect-ratio: 16 / 9; max-width: 100%;
  background: linear-gradient(160deg, var(--stage) 55%, var(--stage-2));
  border-radius: 8px; overflow: hidden; position: relative;
  box-shadow: 0 8px 24px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: 2.6cqw 4cqw 2.4cqw; box-sizing: border-box;
}
.top { display: flex; justify-content: space-between; align-items: center; }
.logo { height: 2.6cqw; width: auto; }
.eyebrow { font-size: 1.3cqw; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ocean); }
.q { font-family: var(--display); font-weight: 800; font-size: 3.3cqw; line-height: 1.12; margin: .8cqw 0 0; text-wrap: balance; max-width: 85%; letter-spacing: -.01em; }
.q.small { font-size: 2.2cqw; font-weight: 700; }
.center { display: grid; place-items: center; text-align: center; }
.big { font-family: var(--display); font-weight: 900; font-variant-numeric: tabular-nums; line-height: .95; }
.label { font-size: 1.6cqw; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.sala { color: var(--sala); } .real { color: var(--real); }
.ph { font-size: 1cqw; color: var(--muted); border: 1px dashed var(--muted); border-radius: 99px; padding: .2cqw .8cqw; }

/* opzioni in fase di voto */
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.4cqw 2cqw; width: 100%; }
.opt { display: flex; align-items: center; gap: 1.4cqw; font-size: 3cqw; font-family: var(--display); font-weight: 800; background: var(--stage); border: 1px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,.08); border-radius: 1cqw; padding: 1.3cqw 2cqw; }
.opt i { font-style: normal; font-size: 1.8cqw; color: #fff; background: var(--sala); border-radius: 50%; width: 3.2cqw; height: 3.2cqw; display: grid; place-items: center; }
.live { font-size: 1.7cqw; color: var(--muted); }
.live b { color: var(--navy); font-variant-numeric: tabular-nums; }

/* barra di partecipazione (ticket 06) */
.part { margin-top: 2.6cqw; display: grid; grid-template-columns: auto 1fr auto; gap: 1.2cqw; align-items: center; font-size: 1.3cqw; color: var(--muted); }
.track { height: .9cqw; background: var(--sky); border-radius: 99px; position: relative; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--sala); border-radius: 99px; transition: width .8s ease; }
.goal { position: absolute; top: -.6cqw; bottom: -.6cqw; width: 2px; background: var(--real); }
.goal span { position: absolute; top: -1.9cqw; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--real); font-size: 1.1cqw; font-weight: 600; }

.guess .big { font-size: 14cqw; color: var(--real); }
.quote { font-family: var(--display); font-weight: 700; font-size: 3.5cqw; line-height: 1.18; max-width: 78%; text-wrap: balance; margin: 0; }
.quote small { display: block; font-family: var(--body); font-weight: 400; font-size: 1.5cqw; color: var(--muted); margin-top: 1.6cqw; }

/* asse con un pallino per voto (variante A) */
.axis-wrap { position: relative; height: 100%; margin: 0 3cqw; }
.axis { position: absolute; left: 0; right: 0; bottom: 4cqw; height: 2px; background: var(--navy); opacity: .5; }
.tick { position: absolute; bottom: 1cqw; transform: translateX(-50%); font-size: 1.9cqw; font-family: var(--display); font-weight: 800; white-space: nowrap; }
.stack { position: absolute; bottom: calc(4cqw + 6px); transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 1.3cqw); gap: .35cqw; direction: rtl; }
.dot { width: 1.3cqw; height: 1.3cqw; border-radius: 50%; background: var(--sala); animation: drop .5s backwards cubic-bezier(.3,1.4,.6,1); }
@keyframes drop { from { transform: translateY(-12cqw); opacity: 0; } }
.flag { position: absolute; bottom: 4cqw; transform: translateX(-50%); display: grid; justify-items: center; animation: flag .9s cubic-bezier(.2,1.3,.4,1) backwards; }
.flag .pole { width: 3px; height: 22cqw; background: var(--real); }
.flag .tag { background: var(--real); color: #fff; font-family: var(--display); font-weight: 900; font-size: 2.6cqw; padding: .5cqw 1.4cqw; border-radius: .6cqw; white-space: nowrap; }
@keyframes flag { from { transform: translate(-50%, -30cqw); opacity: 0; } }
.gap { position: absolute; bottom: 9cqw; height: 0; border-top: 2px dashed var(--real); }
.gap span { position: absolute; left: 50%; transform: translate(-50%, -130%); color: var(--real); font-size: 1.7cqw; white-space: nowrap; font-weight: 700; }

/* scomposizione (dalla variante C), stesso asse in euro partendo da 0 */
.comp { position: relative; height: 100%; margin: 0 3cqw; display: grid; align-content: center; gap: 1.4cqw; }
.bar { position: relative; height: 9cqw; }
.seg { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; text-align: center; font-size: 1.25cqw; font-weight: 700; line-height: 1.25; padding: 0 .4cqw; box-shadow: inset -2px 0 0 #fff; animation: grow .6s backwards ease-out; transform-origin: left; }
.seg b { font-family: var(--display); font-size: 2cqw; display: block; }
@keyframes grow { from { transform: scaleX(0); } }
.est { position: absolute; top: -2.6cqw; height: 2.6cqw; border-left: 3px dashed var(--navy); z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: .8cqw 2.4cqw; font-size: 1.5cqw; font-weight: 600; }
.legend span { display: flex; align-items: center; gap: .6cqw; }
.legend i { width: 1.4cqw; height: 1.4cqw; border-radius: .3cqw; }
.est span { position: absolute; top: -2.2cqw; left: 0; transform: translateX(-50%); white-space: nowrap; font-size: 1.4cqw; font-weight: 700; color: var(--navy); background: var(--stage); padding: 0 .5cqw; }
.scale { display: flex; justify-content: space-between; font-size: 1.3cqw; color: var(--muted); font-variant-numeric: tabular-nums; }
.total { justify-self: end; font-family: var(--display); font-weight: 900; font-size: 3cqw; color: var(--real); }

@media (prefers-reduced-motion: reduce) { .dot, .flag, .seg { animation: none; } .fill { transition: none; } }

/* barra di regia: non fa parte del design proiettato */
.regia {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center;
}
.pill { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: center; background: var(--navy); color: #fff; border-radius: 14px; padding: 8px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.3); font-size: 13px; max-width: 100%; }
.pill button { font: inherit; border: 1px solid rgba(255,255,255,.3); background: transparent; color: inherit; border-radius: 8px; padding: 4px 9px; cursor: pointer; }
.pill button[aria-pressed="true"] { background: var(--sala); border-color: var(--sala); }
.pill button:focus-visible { outline: 2px solid var(--real); outline-offset: 2px; }
.grp { display: flex; gap: 4px; align-items: center; }
.grp b { min-width: 9ch; text-align: center; }
</style>

qz7L78SLZwAAAECmQYXKFxzp8+CtDbS7NLOp4P5a07pxfAAAAECmgSeTr9u4tNK2ZqFnmcTBl950ouuhNRwRAAAAkGngQ6OGpW8t3f7ihCqqs0z/dVePu77Wvft4gSYAAADINBCh+x/hpsOHz/fqLzPJ1G5yacHuE7XuvbKYHgcAAACZBnLkTqnxxBXv9rnpqXkz5/RPCfy6zC5tb1m18obL220sbToxg94FAAAAmQZqFTYfe8miKx6red7OauMq3dhywAeXtc3MbFb1d9P/F1wa/PH/7TMzN19284CWKyt1qPbt0pr5Gx+4ZmHv7vQgAAAAzPH/BRgATg51F8y2DvAAAAAASUVORK5CYII=";

// SEGNAPOSTO: valori e scomposizione da sostituire con i dati del ticket 04.
const QUIZ = {
  3: {
    text: "Per ogni 100 € netti che ricevi in busta paga, quanto spende in tutto l'azienda?",
    opts: [140, 160, 180, 200], real: 200, axis: [120, 220],
    parts: [["Netti in busta", 100, "var(--sala)", "#fff"], ["Tasse e contributi trattenuti", 40, "var(--ocean)", "#fff"], ["Contributi a carico azienda", 45, "var(--sky)", "var(--navy)"], ["TFR e accantonamenti", 15, "var(--real)", "#fff"]],
    say: "Per ogni 100 € che arrivano a voi, l'azienda ne mette 200. E lo stipendio è sempre arrivato puntuale: è merito di tutti noi.",
  },
  7: {
    text: "Quanto vale il premio di produzione, introdotto quest'anno, che riceverai?",
    opts: [300, 500, 800, 1000], real: 800, axis: [200, 1100],
    parts: [],
    say: "È il primo anno del premio. L'abbiamo voluto per dire grazie a chi ogni giorno fa crescere questa azienda.",
  },
};
const PRESENTI = 70;
const LETTERS = ["A", "B", "C", "D"];
const eur = (v) => Math.round(v).toLocaleString("it-IT") + " €";

function fakeVotes(seed) {
  // distribuzione sbilanciata verso il basso, come previsto dal ticket 03
  const w = [0.33, 0.37, 0.21, 0.09].map((x) => x * (0.8 + 0.4 * Math.abs(Math.sin(seed * (x + 1) * 7))));
  const tot = 62 + (seed % 7);
  const s = w.reduce((a, b) => a + b, 0);
  const v = w.map((x) => Math.floor((x / s) * tot));
  v[1] += tot - v.reduce((a, b) => a + b, 0);
  return v;
}
const mean = (q, v) => q.opts.reduce((a, o, i) => a + o * v[i], 0) / v.reduce((a, b) => a + b, 0);

const STEPS = ["Domanda", "L'AD indovina", "La sala ha stimato", "La realtà è", "Da dove vengono", "Commento dell'AD"];

function Head({ n, q, small }) {
  return (
    <div>
      <div className="top"><div className="eyebrow">Quiz · domanda {n} di 12</div><span className="ph">valori segnaposto</span></div>
      <h1 className={"q" + (small ? " small" : "")}>{q.text}</h1>
    </div>
  );
}
function Partecipazione({ pct }) {
  return (
    <div className="part">
      <img className="logo" src={LOGO} alt="Immedia" />
      <div className="track"><div className="fill" style={{ width: pct + "%" }} /><div className="goal" style={{ left: "80%" }}><span>premio della sala</span></div></div>
      <span style={{ fontVariantNumeric: "tabular-nums" }}>Partecipazione {pct}%</span>
    </div>
  );
}
function Voting({ q, votes }) {
  const tot = votes.reduce((a, b) => a + b, 0);
  return (
    <div className="center" style={{ gap: "1.6cqw", alignContent: "center" }}>
      <div className="opts">{q.opts.map((o, i) => <div className="opt" key={o}><i>{LETTERS[i]}</i>{eur(o)}</div>)}</div>
      <div className="live">Hanno risposto <b>{tot}</b> su {PRESENTI}</div>
    </div>
  );
}
function Guess() {
  return <div className="center guess"><div><div className="label sala">Prima di vedere i voti</div><div className="big">?</div><div className="label">secondo l'AD, la sala ha scelto…</div></div></div>;
}
function Comment({ q }) {
  return <div className="center"><p className="quote">“{q.say}”<small>Testo segnaposto, da scrivere con l'AD</small></p></div>;
}

function Asse({ q, votes, step }) {
  const [lo, hi] = q.axis;
  const x = (v) => ((v - lo) / (hi - lo)) * 100 + "%";
  const m = mean(q, votes);
  let k = 0;
  return (
    <div className="axis-wrap">
      <div className="label sala" style={{ position: "absolute", top: "1cqw", left: 0 }}>La sala ha stimato · {votes.reduce((a, b) => a + b, 0)} voti · in media {eur(m)}</div>
      <div className="axis" />
      {q.opts.map((o, i) => (
        <React.Fragment key={o}>
          <div className="tick" style={{ left: x(o) }}>{eur(o)}</div>
          <div className="stack" style={{ left: x(o) }}>
            {Array.from({ length: votes[i] }, (_, j) => <div className="dot" key={j} style={{ animationDelay: (k++ * 18) + "ms" }} />)}
          </div>
        </React.Fragment>
      ))}
      {step >= 3 && <>
        <div className="flag" style={{ left: x(q.real) }}><div className="tag">La realtà è {eur(q.real)}</div><div className="pole" /></div>
        <div className="gap" style={{ left: x(m), width: `calc(${x(q.real)} - ${x(m)})` }}><span>+{eur(q.real - m)} di quanto stimato</span></div>
      </>}
    </div>
  );
}

function Scomposizione({ q, votes }) {
  const m = mean(q, votes);
  const top = q.real;
  const w = (v) => (v / top) * 100 + "%";
  let acc = 0;
  return (
    <div className="comp">
      <div className="label real">Da dove vengono i {eur(q.real)}</div>
      <div className="bar">
        {q.parts.map(([lab, v, bg, fg], i) => {
          const l = acc; acc += v;
          return <div className="seg" key={lab} style={{ left: w(l), width: w(v), background: bg, color: fg, animationDelay: i * 450 + "ms" }}><b>{eur(v)}</b></div>;
        })}
        <div className="est" style={{ left: w(m) }}><span>la sala aveva stimato {eur(m)}</span></div>
      </div>
      <div className="legend">{q.parts.map(([lab, , bg]) => <span key={lab}><i style={{ background: bg }} />{lab}</span>)}</div>
      <div className="scale"><span>0 €</span><span>{eur(top / 2)}</span><span>{eur(top)}</span></div>
      <div className="total">= {eur(q.real)}</div>
    </div>
  );
}

function App() {
  const [qn, setQn] = useState(3);
  const [step, setStep] = useState(0);
  const [guess, setGuess] = useState(true);
  const [seed, setSeed] = useState(3);
  const q = QUIZ[qn];
  const votes = fakeVotes(seed + qn);
  const tot = votes.reduce((a, b) => a + b, 0);
  const steps = STEPS.map((s, i) => i).filter((i) => (guess || i !== 1) && (q.parts.length > 1 || i !== 4));
  const idx = Math.max(0, steps.indexOf(step));
  const pct = Math.round(((84 * 2) + (step >= 2 ? (tot / PRESENTI) * 100 : 0)) / (step >= 2 ? 3 : 2));

  const go = (d) => setStep(steps[Math.min(steps.length - 1, Math.max(0, idx + d))]);
  const pickQ = (n) => { setQn(n); setStep(0); };

  useEffect(() => {
    const on = (e) => {
      if (e.target.closest("input, textarea, [contenteditable]")) return;
      if (e.key === " " || e.key === "PageDown" || e.key === "ArrowRight") { e.preventDefault(); go(1); }
      else if (e.key === "Backspace" || e.key === "PageUp" || e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      else if (e.key === "1") pickQ(3); else if (e.key === "2") pickQ(7);
    };
    addEventListener("keydown", on);
    return () => removeEventListener("keydown", on);
  });

  let body;
  if (step === 0) body = <Voting q={q} votes={votes} />;
  else if (step === 1) body = <Guess />;
  else if (step === 4) body = <Scomposizione q={q} votes={votes} key={"s" + qn + seed} />;
  else if (step === 5) body = <Comment q={q} />;
  else body = <Asse q={q} votes={votes} step={step} key={"a" + qn + seed} />;

  return (
    <>
      <p className="note">Prototipo usa e getta del ticket 07, iterazione 2: asse dei voti con scomposizione, colori Immedia. Valori e voti sono <b>segnaposto</b>. Spazio, PagGiù o → per avanzare (anche col telecomando delle slide); 1 e 2 cambiano domanda.</p>
      <section className="stage" aria-label="Schermo proiettato">
        <Head n={qn} q={q} small={step >= 2 && step <= 4} />
        {body}
        <Partecipazione pct={pct} />
      </section>
      <nav className="regia" aria-label="Regia">
        <div className="pill">
          <div className="grp"><button onClick={() => go(-1)}>Indietro</button><b>{idx + 1}/{steps.length} {STEPS[step]}</b><button onClick={() => go(1)}>Avanti</button></div>
          <div className="grp">{[3, 7].map((n) => <button key={n} aria-pressed={qn === n} onClick={() => pickQ(n)}>Quiz {n}</button>)}</div>
          <button aria-pressed={guess} onClick={() => { setGuess(!guess); if (step === 1) setStep(0); }}>L'AD indovina</button>
          <button onClick={() => setSeed(seed + 1)}>Altri voti</button>
        </div>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
